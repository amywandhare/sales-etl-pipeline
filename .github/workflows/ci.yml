      - name: Build wheel
        run: |
          python -m pip wheel \
            --no-deps \
            --wheel-dir dist \
            .

      - name: Validate wheel
        run: |
          twine check dist/*

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: sales-etl-wheel
          path: dist/*.whl
          if-no-files-found: error

