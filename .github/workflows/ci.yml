name: Sales ETL CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test, Scan and Build Package
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out source # download the source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install ruff bandit pip-audit twine

      - name: Verify package imports
        run: |
          python -c "import sales_etl; print('Package import successful')"

      - name: Run Ruff linting
        run: |
          ruff check src/sales_etl

      - name: Run Bandit security scan
        run: |
          bandit -r src/sales_etl

      - name: Run dependency vulnerability scan
        run: |
          pip-audit -f json -o pip-audit-report.json || true
         
      - name: Upload dependency scan report
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json

      - name: Run tests with coverage
        run: |
          python -m pytest \
            -v \
            --cov=sales_etl \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

